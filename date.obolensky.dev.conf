# Nginx configuration for date.obolensky.dev

server {
    listen 80;
    listen [::]:80;
    server_name date.obolensky.dev;

    # Let's Encrypt validation location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name date.obolensky.dev;

    # SSL Certificates (issued via Certbot)
    ssl_certificate /etc/letsencrypt/live/date.obolensky.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/date.obolensky.dev/privkey.pem;

    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client upload limits
    client_max_body_size 10M;

    # Proxy to Docker container on localhost:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static assets like .webm stickers and css
    location ~* \.(webm|webp|png|jpg|jpeg|gif|ico|svg|css|js)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
